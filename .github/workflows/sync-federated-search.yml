name: Deploy Zendesk Federated Search

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      ZENDESK_USER: ${{ secrets.ZENDESK_USER }}
      ZENDESK_PASS: ${{ secrets.ZENDESK_TOKEN }}
      ZENDESK_SUBDOMAIN: arduino
      ZENDESK_FEDERATED_SOURCE_ID: ${{ vars.ZENDESK_FEDERATED_SOURCE_ID || secrets.ZENDESK_FEDERATED_SOURCE_ID }}
      ZENDESK_FEDERATED_TYPE_ID: ${{ vars.ZENDESK_FEDERATED_TYPE_ID || secrets.ZENDESK_FEDERATED_TYPE_ID }}
      ALGOLIA_APPLICATION_ID: ${{ secrets.ALGOLIA_APPLICATION_ID }}
      ALGOLIA_INDEXER_KEY: ${{ secrets.ALGOLIA_INDEXER_KEY }}
      ALGOLIA_INDEX: ${{ secrets.ALGOLIA_INDEX }}

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync Algolia Index to Zendesk Federated Search
        run: node _deploy/federated-search-sync.mjs
