name: validate content

permissions:
  contents: read

on:
  workflow_dispatch:
  repository_dispatch:
    types: deploy
  push:
    branches:
      - main
    paths:
      - 'content/**'
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    paths:
      - 'content/**'

jobs:
  markdown:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Markdownlint
        run: |
          cd scripts/linter
          npm install
          cd ../..
          node scripts/linter/markdownlint.js

  zendesk:
    # The dry run needs Zendesk secrets and ~450 API calls: run it on PRs and
    # manual runs only, not on every push to main (deploy-prod covers that).
    if: github.repository_owner == 'arduino' && github.event_name != 'push'
    runs-on: ubuntu-latest

    # Prevents concurrency with itself AND any other workflows 
    # using the the Zendesk API, to avoid breaching request limits.

    concurrency:
      group: zendesk-api
      cancel-in-progress: false

    env:
      ZENDESK_USER: ${{ secrets.ZENDESK_USER }}
      ZENDESK_PASS: ${{ secrets.ZENDESK_TOKEN }}

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Preview changes
        run: |
          cd _deploy
          npm install
          cd ..
          node _deploy/zendesk.mjs content '*/*/*.md' https://arduino.zendesk.com/api/v2/help_center --wait 60
